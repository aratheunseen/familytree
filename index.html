<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FamilyTree - বংশতালিকা</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <!-- Bengali Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@300;400;500;600;700;800&family=Hind+Siliguri:wght@300;400;500;600;700&family=Noto+Serif+Bengali:wght@400;600;700;800&display=swap" rel="stylesheet">

  <!-- Export Engines -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Hind Siliguri"', '"Anek Bangla"', 'sans-serif'],
            serif: ['"Noto Serif Bengali"', 'serif'],
            bangla: ['"Hind Siliguri"', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    /* Custom Scrollbars */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.8); }
    ::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.4); border-radius: 99px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255, 215, 0, 0.8); }

    /* Canvas Transformations & Gestures */
    .viewport-canvas {
      user-select: none;
      transform-origin: 0 0;
      will-change: transform;
      touch-action: none;
    }
    .canvas-panning { cursor: grabbing !important; }
    .canvas-grab { cursor: grab; }

    /* --- LUXURY GOLDEN THEMES --- */

    /* ১. গোল্ডেন রয়্যাল (Royal Golden - Default Primary Theme) */
    .theme-royal-gold {
      --bg-color: #0b0905;
      --bg-pattern: radial-gradient(circle at 50% 50%, rgba(212, 175, 55, 0.12) 0%, transparent 65%),
                          radial-gradient(rgba(212, 175, 55, 0.25) 1px, transparent 1px);
      --bg-pattern-size: 100% 100%, 32px 32px;
      --card-bg: linear-gradient(145deg, rgba(26, 22, 14, 0.96) 0%, rgba(15, 12, 7, 0.98) 100%);
      --card-border: #d4af37;
      --card-text: #fffdfa;
      --card-subtext: #d4cfc5;
      --accent-badge: linear-gradient(135deg, #ffd700 0%, #b8860b 100%);
      --badge-text: #0b0905;
      --line-color: #d4af37;
      --line-shadow: drop-shadow(0px 2px 6px rgba(212, 175, 55, 0.4));
      --title-font: 'Noto Serif Bengali', serif;
      --title-color: #fef08a;
      --gold-glow: 0 10px 30px -5px rgba(212, 175, 55, 0.25);
    }

    /* ২. অভিজাত লাইট (Slate Gold) */
    .theme-slate-gold {
      --bg-color: #f8fafc;
      --bg-pattern: radial-gradient(rgba(180, 140, 30, 0.2) 1.2px, transparent 1.2px);
      --bg-pattern-size: 28px 28px;
      --card-bg: #ffffff;
      --card-border: #b8860b;
      --card-text: #0f172a;
      --card-subtext: #475569;
      --accent-badge: #b8860b;
      --badge-text: #ffffff;
      --line-color: #b8860b;
      --line-shadow: none;
      --title-font: 'Hind Siliguri', sans-serif;
      --title-color: #1e293b;
      --gold-glow: 0 8px 20px -4px rgba(184, 134, 11, 0.15);
    }

    /* ৩. ডার্ক এমারেল্ড (Dark Emerald Gold) */
    .theme-emerald-gold {
      --bg-color: #03140e;
      --bg-pattern: radial-gradient(circle at 50% 50%, rgba(16, 185, 129, 0.1) 0%, transparent 60%),
                          radial-gradient(rgba(212, 175, 55, 0.2) 1.2px, transparent 1.2px);
      --bg-pattern-size: 100% 100%, 30px 30px;
      --card-bg: linear-gradient(145deg, rgba(6, 38, 25, 0.96) 0%, rgba(3, 20, 14, 0.98) 100%);
      --card-border: #d4af37;
      --card-text: #f8fafc;
      --card-subtext: #cbd5e1;
      --accent-badge: linear-gradient(135deg, #10b981 0%, #047857 100%);
      --badge-text: #ffffff;
      --line-color: #d4af37;
      --line-shadow: drop-shadow(0px 2px 5px rgba(212, 175, 55, 0.3));
      --title-font: 'Noto Serif Bengali', serif;
      --title-color: #a7f3d0;
      --gold-glow: 0 10px 25px -5px rgba(16, 185, 129, 0.25);
    }

    /* ৪. সফিস্টিকেটেড ক্লাসিক (Pure Minimal) */
    .theme-minimal-dark {
      --bg-color: #0f172a;
      --bg-pattern: linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px),
                          linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px);
      --bg-pattern-size: 32px 32px;
      --card-bg: #1e293b;
      --card-border: #38bdf8;
      --card-text: #f8fafc;
      --card-subtext: #94a3b8;
      --accent-badge: #0284c7;
      --badge-text: #ffffff;
      --line-color: #38bdf8;
      --line-shadow: none;
      --title-font: 'Anek Bangla', sans-serif;
      --title-color: #38bdf8;
      --gold-glow: 0 8px 20px -4px rgba(56, 189, 248, 0.2);
    }

    /* Dynamic Canvas Applied Theme Classes */
    .canvas-theme-container {
      background-color: var(--bg-color);
      background-image: var(--bg-pattern);
      background-size: var(--bg-pattern-size);
    }

    .tree-card {
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      color: var(--card-text);
      box-shadow: var(--gold-glow);
    }

    .tree-card-subtext {
      color: var(--card-subtext);
    }

    .tree-title {
      font-family: var(--title-font);
      color: var(--title-color);
    }

    .tree-badge {
      background: var(--accent-badge);
      color: var(--badge-text);
    }

    .tree-line {
      stroke: var(--line-color);
      stroke-width: 2.5px;
      fill: none;
      stroke-linecap: round;
      filter: var(--line-shadow);
    }

    .avatar-gold-frame {
      border: 2px solid #d4af37;
      box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
    }

    .focused-node-highlight {
      outline: 3px solid #ffd700;
      animation: goldPulse 1.8s infinite;
    }

    @keyframes goldPulse {
      0%, 100% { box-shadow: 0 0 0 0px rgba(255, 215, 0, 0.8); }
      50% { box-shadow: 0 0 0 14px rgba(255, 215, 0, 0); }
    }

    /* Export Frame Sizes */
    .aspect-sq { width: 1200px; height: 1200px; }
    .aspect-port { width: 1200px; height: 1500px; }
    .aspect-story { width: 1080px; height: 1920px; }
    .aspect-land { width: 1200px; height: 675px; }
  </style>
</head>
<body class="h-screen w-screen flex flex-col bg-amber-950/20 text-slate-100 font-sans overflow-hidden antialiased select-none">

  <!-- EXECUTIVE HEADER -->
  <header class="h-16 bg-slate-950/95 border-b border-amber-500/30 px-4 flex items-center justify-between z-30 shrink-0 backdrop-blur-md">
    
    <!-- Brand Title -->
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-amber-400 via-amber-500 to-yellow-600 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg shadow-amber-500/20 border border-amber-300">
        <i class="fa-solid fa-crown"></i>
      </div>
      <div>
        <h1 class="text-xl font-black tracking-tight text-amber-200 flex items-center gap-2 font-serif">
          FamilyTree <span class="text-amber-400 text-sm font-sans font-normal">(বংশতালিকা)</span>
        </h1>
      </div>
    </div>

    <!-- Header Actions -->
    <div class="flex items-center space-x-2">
      <!-- Backup Save/Load -->
      <button onclick="exportJSONData()" class="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 text-xs font-bold text-amber-200 rounded-lg border border-amber-500/40 transition flex items-center gap-1.5" title="বাংলা ডাটা ফাইল সেভ করুন">
        <i class="fa-solid fa-download text-amber-400"></i> <span class="hidden md:inline">ডাটা সেভ (.JSON)</span>
      </button>
      
      <label class="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 text-xs font-bold text-slate-200 rounded-lg border border-slate-700 transition flex items-center gap-1.5 cursor-pointer">
        <i class="fa-solid fa-upload text-amber-400"></i> <span class="hidden md:inline">ডাটা লোড</span>
        <input type="file" id="jsonFileInput" accept=".json" class="hidden" onchange="importJSONData(event)">
      </label>

      <!-- Reset Tree Data -->
      <button onclick="confirmResetData()" class="p-2 bg-slate-900 hover:bg-slate-800 text-xs font-bold text-rose-400 rounded-lg border border-slate-800 transition" title="রিসেট ডেমো ডাটা">
        <i class="fa-solid fa-rotate-left"></i>
      </button>

      <div class="h-6 w-px bg-slate-800 mx-1"></div>

      <!-- Export Modal Launcher -->
      <button onclick="openExportModal()" class="px-4 py-2 bg-gradient-to-r from-amber-400 via-yellow-500 to-amber-600 hover:brightness-110 text-slate-950 font-black text-xs uppercase tracking-wider rounded-lg shadow-lg shadow-amber-500/20 transition flex items-center gap-2 border border-amber-300">
        <i class="fa-solid fa-file-export text-sm"></i> এক্সপোর্ট ও প্রিন্ট
      </button>
    </div>

  </header>

  <!-- STUDIO WORKSPACE -->
  <div class="flex-1 flex relative overflow-hidden">

    <!-- LEFT SIDEBAR: 3 TABS -->
    <aside class="w-80 bg-slate-950/95 border-r border-amber-500/20 flex flex-col shrink-0 z-20 backdrop-blur-md">
      
      <!-- TAB NAVIGATION -->
      <div class="flex border-b border-amber-500/20 bg-slate-900/80 p-1">
        <button onclick="switchSidebarTab('members')" id="tabBtn-members" class="flex-1 py-2 text-xs font-bold rounded-lg transition text-amber-300 bg-slate-800 border border-amber-500/30 flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-users text-amber-400"></i> সদস্য তালিকা
        </button>
        <button onclick="switchSidebarTab('form')" id="tabBtn-form" class="flex-1 py-2 text-xs font-bold text-slate-400 hover:text-slate-200 rounded-lg transition flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-user-plus"></i> তথ্য ফর্ম
        </button>
        <button onclick="switchSidebarTab('design')" id="tabBtn-design" class="flex-1 py-2 text-xs font-bold text-slate-400 hover:text-slate-200 rounded-lg transition flex items-center justify-center gap-1.5">
          <i class="fa-solid fa-sliders"></i> লেআউট ও ডিজাইন
        </button>
      </div>

      <!-- TAB 1: MEMBER LIST (সদস্য তালিকা) -->
      <div id="tabContent-members" class="flex-1 flex flex-col overflow-hidden p-3 space-y-3">
        <!-- Search -->
        <div class="relative">
          <i class="fa-solid fa-magnifying-glass absolute left-3 top-2.5 text-xs text-amber-500/70"></i>
          <input type="text" id="memberSearchInput" oninput="renderMemberList()" placeholder="সদস্যের নাম খুঁজুন..." class="w-full bg-slate-900 border border-amber-500/30 rounded-xl pl-8 pr-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-amber-400">
        </div>

        <div class="flex items-center justify-between text-xs text-slate-400 px-1 font-semibold">
          <span>মোট পরিবার সদস্য:</span>
          <span id="memberCountBadge" class="font-bold text-amber-300 bg-amber-950/80 border border-amber-500/40 px-2.5 py-0.5 rounded-md">০ জন</span>
        </div>

        <!-- Scrollable Cards -->
        <div id="sidebarMemberList" class="flex-1 overflow-y-auto space-y-2 pr-1"></div>

        <button onclick="prepareNewMemberForm()" class="w-full py-2 bg-amber-500/10 hover:bg-amber-500/20 text-amber-300 border border-amber-500/40 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-plus text-amber-400"></i> নতুন সদস্য যোগ করুন
        </button>
      </div>

      <!-- TAB 2: FORM FILL-UP (সদস্য যোগ / সম্পাদনা) -->
      <div id="tabContent-form" class="hidden flex-1 overflow-y-auto p-4 space-y-3">
        <div class="flex items-center justify-between border-b border-amber-500/20 pb-2">
          <h3 id="formHeadingTitle" class="font-bold text-xs text-amber-400 uppercase tracking-wider">নতুন সদস্য যোগ করুন</h3>
          <button onclick="clearFormFill()" class="text-[11px] text-slate-400 hover:text-white underline">নতুন ফর্ম</button>
        </div>

        <form id="treeMemberForm" onsubmit="handleFormFillSubmit(event)" class="space-y-3">
          <input type="hidden" id="formMemberId">

          <div>
            <label class="block text-[11px] font-bold text-amber-200/90 uppercase mb-1">পূর্ণ নাম <span class="text-rose-400">*</span></label>
            <input type="text" id="fName" required placeholder="যেমন: আলহাজ্ব রফিকুল ইসলাম চৌধুরী" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-amber-400">
          </div>

          <div>
            <label class="block text-[11px] font-bold text-amber-200/90 uppercase mb-1">পরিচয় / পদবী উপাধি</label>
            <input type="text" id="fBadge" placeholder="যেমন: মূল পুরুষ / জ্যেষ্ঠ পিতা / প্রপিতামহ" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-amber-400">
          </div>

          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-[11px] font-bold text-amber-200/90 uppercase mb-1">লিঙ্গ</label>
              <select id="fGender" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-2 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-amber-400">
                <option value="male">পুরুষ</option>
                <option value="female">নারী</option>
                <option value="other">অন্যান্য</option>
              </select>
            </div>
            <div>
              <label class="block text-[11px] font-bold text-amber-200/90 uppercase mb-1">জন্ম বছর</label>
              <input type="text" id="fBirth" placeholder="১৯৪৫" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-2 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-amber-400">
            </div>
          </div>

          <div>
            <label class="block text-[11px] font-bold text-amber-200/90 uppercase mb-1">মৃত্যু বছর (যদি প্রযোজ্য হয়)</label>
            <input type="text" id="fDeath" placeholder="২০২১ (জীবিত থাকলে খালি রাখুন)" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-amber-400">
          </div>

          <div>
            <label class="block text-[11px] font-bold text-amber-200/90 uppercase mb-1">ছবি (Image URL / আপলোড)</label>
            <input type="url" id="fPhotoUrl" placeholder="https://..." class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-100 mb-1.5 focus:outline-none focus:border-amber-400">
            <input type="file" id="fPhotoFile" accept="image/*" onchange="handleFileUpload(event, 'fPhotoUrl')" class="text-[10px] text-slate-400 file:mr-2 file:py-1 file:px-2 file:rounded-lg file:border-0 file:text-[10px] file:font-semibold file:bg-slate-800 file:text-amber-300 hover:file:bg-slate-700">
          </div>

          <div>
            <label class="block text-[11px] font-bold text-amber-200/90 uppercase mb-1">সংক্ষিপ্ত বিবরণ</label>
            <textarea id="fBio" rows="2" placeholder="সংক্ষিপ্ত বিবরণ বা পেশা..." class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-100 focus:outline-none focus:border-amber-400"></textarea>
          </div>

          <!-- Relationships -->
          <div class="pt-2 border-t border-amber-500/20 space-y-2">
            <p class="text-[11px] font-bold text-amber-400 uppercase"><i class="fa-solid fa-sitemap mr-1"></i> সম্পর্ক নির্ধারণ</p>

            <div>
              <label class="block text-[10px] font-semibold text-slate-400 mb-0.5">পিতা (Father):</label>
              <select id="fFatherId" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-amber-400">
                <option value="">-- পিতা নির্বাচন করুন --</option>
              </select>
            </div>

            <div>
              <label class="block text-[10px] font-semibold text-slate-400 mb-0.5">মাতা (Mother):</label>
              <select id="fMotherId" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-amber-400">
                <option value="">-- মাতা নির্বাচন করুন --</option>
              </select>
            </div>

            <div>
              <label class="block text-[10px] font-semibold text-slate-400 mb-0.5">স্বামী/স্ত্রী (Spouse):</label>
              <select id="fSpouseId" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-2 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-amber-400">
                <option value="">-- স্বামী/স্ত্রী নির্বাচন করুন --</option>
              </select>
            </div>
          </div>

          <div class="pt-2 flex items-center gap-2">
            <button type="submit" class="flex-1 py-2 bg-gradient-to-r from-amber-400 to-yellow-500 hover:brightness-110 text-slate-950 font-bold text-xs uppercase tracking-wider rounded-xl shadow transition">
              <i class="fa-solid fa-floppy-disk mr-1"></i> সংরক্ষণ করুন
            </button>
            <button type="button" onclick="clearFormFill()" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 text-xs font-bold rounded-xl">
              ক্লিয়ার
            </button>
          </div>
        </form>
      </div>

      <!-- TAB 3: LAYOUT & DESIGN (লেআউট ও ডিজাইন) -->
      <div id="tabContent-design" class="hidden flex-1 overflow-y-auto p-4 space-y-5">
        
        <!-- Banner Title Input -->
        <div>
          <label class="block text-xs font-bold text-amber-200/90 uppercase mb-2">
            <i class="fa-solid fa-heading text-amber-400 mr-1"></i> বংশতালিকার শিরোনাম
          </label>
          <input type="text" id="familyTitleInput" value="চৌধুরী পরিবারের বংশতালিকা" oninput="updateBannerTitle(this.value)" class="w-full bg-slate-900 border border-amber-500/30 rounded-xl px-3 py-1.5 text-xs text-slate-100 font-bold focus:outline-none focus:border-amber-400 mb-2">
          <input type="text" id="familySubTitleInput" value="প্রজন্ম থেকে প্রজন্মে পারিবারিক ঐতিহ্য" oninput="updateBannerSubtitle(this.value)" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-3 py-1.5 text-xs text-slate-400 focus:outline-none focus:border-amber-400">
        </div>

        <!-- Layout Direction Toggle -->
        <div>
          <label class="block text-xs font-bold text-amber-200/90 uppercase mb-2">
            <i class="fa-solid fa-diagram-project text-sky-400 mr-1"></i> লেআউট ওরিয়েন্টেশন
          </label>
          <div class="grid grid-cols-2 gap-2">
            <button onclick="setLayoutDirection('vertical')" id="layoutBtn-vertical" class="p-2.5 bg-slate-900 border border-amber-400 rounded-xl text-center text-xs font-bold text-amber-300 transition">
              <i class="fa-solid fa-arrows-up-down block text-base mb-1"></i> উল্লম্ব (Vertical)
            </button>
            <button onclick="setLayoutDirection('horizontal')" id="layoutBtn-horizontal" class="p-2.5 bg-slate-900 border border-slate-800 rounded-xl text-center text-xs font-bold text-slate-400 hover:text-slate-200 transition">
              <i class="fa-solid fa-arrows-left-right block text-base mb-1"></i> অনুভূমিক (Horizontal)
            </button>
          </div>
        </div>

        <!-- Node Spacing Slider -->
        <div>
          <label class="block text-xs font-bold text-amber-200/90 uppercase mb-2 flex justify-between">
            <span><i class="fa-solid fa-arrows-left-right-to-line text-amber-400 mr-1"></i> কার্ডের মধ্যকার দূরত্ব</span>
            <span id="spacingValueBadge" class="text-amber-400 font-mono">মাঝারি</span>
          </label>
          <input type="range" id="nodeGapSlider" min="20" max="100" step="10" value="48" oninput="updateNodeSpacing(this.value)" class="w-full accent-amber-500 cursor-pointer">
        </div>

        <!-- Theme Options -->
        <div>

    // Helper: Bengali Numerals
    function toBengaliNumerals(str) {
      if (str === null || str === undefined) return '';
      const bnDigits = ['০','১','২','৩','৪','৫','৬','৭','৮','৯'];
      return str.toString().replace(/\d/g, (x) => bnDigits[x]);
    }

    // --- APPLICATION INITIALIZATION ---

      loadDataFromStorage();

    });

    // Storage Engines
    function loadDataFromStorage() {
      const savedRaw = localStorage.getItem(STORAGE_KEY);
      if (savedRaw) {
        try {
          const parsed = JSON.parse(savedRaw);
          if (Array.isArray(parsed) && parsed.length > 0) {
            familyData = parsed;
          } else {
            familyData = JSON.parse(JSON.stringify(initialDefaultData));
          }
        } catch(e) {
          familyData = JSON.parse(JSON.stringify(initialDefaultData));
        }
      } else {
        familyData = JSON.parse(JSON.stringify(initialDefaultData));
        saveDataToStorage();
      }
    }

    function saveDataToStorage() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(familyData));
      populateFormSelectors();
      renderMemberList();
      renderTree();

        saveDataToStorage();
      }
    }

    // --- MAC TOUCHPAD & ZOOM CONTROL ENGINE ---
    function setupMacTouchpadControls() {
      const viewport = document.getElementById('viewport');

      viewport.addEventListener('wheel', (e) => {
        e.preventDefault();

        if (e.ctrlKey) {
          const rect = viewport.getBoundingClientRect();
          const mouseX = e.clientX - rect.left;
          const mouseY = e.clientY - rect.top;

          const zoomFactor = Math.pow(0.992, e.deltaY);
          const newZoom = Math.min(Math.max(0.1, currentZoom * zoomFactor), 3.0);

          panX = mouseX - (mouseX - panX) * (newZoom / currentZoom);
          panY = mouseY - (mouseY - panY) * (newZoom / currentZoom);
          currentZoom = newZoom;
        } else {
          panX -= e.deltaX;
          panY -= e.deltaY;
        }

        applyTransform();
      }, { passive: false });

      // Mouse Panning
      viewport.addEventListener('mousedown', (e) => {
        if (e.target.closest('.tree-card') || e.target.closest('button') || e.target.closest('input')) return;
        isPanning = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        viewport.classList.replace('canvas-grab', 'canvas-panning');
      });

      window.addEventListener('mousemove', (e) => {
        if (!isPanning) return;
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        applyTransform();
      });

      window.addEventListener('mouseup', () => {
        isPanning = false;
        viewport.classList.replace('canvas-panning', 'canvas-grab');
      });
    }

    function applyTransform() {
      const canvas = document.getElementById('canvasViewport');
      canvas.style.transform = `translate(${panX}px, ${panY}px) scale(${currentZoom})`;
      
      document.getElementById('zoomRangeSlider').value = currentZoom;
      document.getElementById('zoomPercentBadge').innerText = toBengaliNumerals(Math.round(currentZoom * 100)) + '%';
    }

    function handleZoomSlider(val) {
      currentZoom = parseFloat(val);
      applyTransform();
    }

    function zoomIn() {
      currentZoom = Math.min(3.0, currentZoom + 0.15);
      applyTransform();
    }

    function zoomOut() {
      currentZoom = Math.max(0.1, currentZoom - 0.15);
      applyTransform();
    }

    function resetZoom() {
      currentZoom = 1.0;
      panX = 0;
      panY = 0;
      applyTransform();
    }

      activeBtn.classList.remove('text-slate-400');
      document.getElementById(`tabContent-${tabKey}`).classList.remove('hidden');

    // --- MEMBER LIST & CENTERING FOCUS ---

      const filtered = familyData.filter(m =>

      document.getElementById('memberCountBadge').innerText = `${toBengaliNumerals(familyData.length)} জন`;

      filtered.forEach(m => {

        const avatar = m.photo

        item.onclick = () => focusMemberNode(m.id);

        item.innerHTML = `
          <div class="flex items-center space-x-2.5 overflow-hidden">
            ${avatar}
            <div class="overflow-hidden">
              <h5 class="text-xs font-bold text-amber-100 truncate group-hover:text-amber-400 transition">${m.name}</h5>
              <p class="text-[10px] text-slate-400 truncate">${m.badge || 'পরিবার সদস্য'}</p>
            </div>
          </div>
          <div class="flex items-center gap-1 opacity-80 group-hover:opacity-100">
            <button onclick="event.stopPropagation(); prepareAddChildForm('${m.id}')" class="p-1 text-amber-400 hover:bg-amber-950 rounded" title="সন্তান যোগ"><i class="fa-solid fa-plus text-[10px]"></i></button>
            <button onclick="event.stopPropagation(); populateFormForEdit('${m.id}')" class="p-1 text-sky-400 hover:bg-sky-950 rounded" title="সম্পাদন"><i class="fa-solid fa-pen text-[10px]"></i></button>

        `;
        listContainer.appendChild(item);

    function focusMemberNode(memberId) {
      const node = document.getElementById(`node-${memberId}`);
      if (!node) return;

      document.querySelectorAll('.tree-card').forEach(c => c.classList.remove('focused-node-highlight'));
      node.classList.add('focused-node-highlight');

      const nodeRect = node.getBoundingClientRect();
      const viewportRect = document.getElementById('viewport').getBoundingClientRect();

      panX = (viewportRect.width / 2) - (nodeRect.left - panX + nodeRect.width / 2);
      panY = (viewportRect.height / 2) - (nodeRect.top - panY + nodeRect.height / 2);
      
      applyTransform();

      setTimeout(() => {
        node.classList.remove('focused-node-highlight');
      }, 3000);
    }

    // --- TREE RENDER ENGINE ---
    let spouseVisitedMap = new Set();

    function renderTree() {
      spouseVisitedMap.clear();

      const container = document.getElementById('treeBranchRoot');
      container.innerHTML = '';

      if (!familyData || familyData.length === 0) {
        container.innerHTML = `
          <div class="text-center py-16 text-slate-400">
            <i class="fa-solid fa-users-slash text-5xl mb-4 text-amber-500/40"></i>
            <p class="text-base font-bold text-amber-200/90">কোনো বংশতালিকা তথ্য পাওয়া যায়নি</p>
            <button onclick="prepareNewMemberForm()" class="mt-4 px-5 py-2.5 bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 font-bold rounded-xl text-xs uppercase tracking-wider shadow">
              প্রথম সদস্য যোগ করুন
            </button>
          </div>
        `;
        drawConnectors();
        return;
      }

      // Root Identification Logic
      const allChildrenIds = new Set(familyData.flatMap(m => m.childrenIds || []));
      const rootMembers = familyData.filter(m => !allChildrenIds.has(m.id) && !m.fatherId && !spouseVisitedMap.has(m.id));

      const treeWrapper = document.createElement('div');
      treeWrapper.style.gap = `${nodeGapSpacing}px`;
      treeWrapper.className = currentLayout === 'vertical' 
        ? 'flex justify-center items-start' 
        : 'flex flex-col items-start justify-center';

      let visitedSet = new Set();
      rootMembers.forEach(root => {
        treeWrapper.appendChild(buildBranch(root.id, visitedSet));
      });

      container.appendChild(treeWrapper);
      setTimeout(drawConnectors, 40);
    }

    function buildBranch(memberId, visited) {
      if (visited.has(memberId)) return document.createElement('div');
      visited.add(memberId);

      const member = familyData.find(m => m.id === memberId);
      if (!member) return document.createElement('div');

      const branch = document.createElement('div');
      branch.className = currentLayout === 'vertical'
        ? 'flex flex-col items-center'
        : 'flex items-center';

      // Couple Row
      const coupleDiv = document.createElement('div');
      coupleDiv.className = 'flex items-center gap-3 relative z-10';

      coupleDiv.appendChild(createMemberCard(member));

      // Spouse Card
      if (member.spouseId) {
        const spouse = familyData.find(m => m.id === member.spouseId);
        if (spouse) {
          spouseVisitedMap.add(spouse.id);

          const heartTag = document.createElement('div');
          heartTag.className = 'w-6 h-6 rounded-full bg-gradient-to-tr from-amber-400 to-yellow-500 text-slate-950 flex items-center justify-center font-bold text-[10px] shadow-lg border border-yellow-300';
          heartTag.innerHTML = '<i class="fa-solid fa-heart"></i>';

          coupleDiv.appendChild(heartTag);
          coupleDiv.appendChild(createMemberCard(spouse));
        }
      }

      branch.appendChild(coupleDiv);

      // Render Children
      if (member.childrenIds && member.childrenIds.length > 0) {
        const childrenContainer = document.createElement('div');
        childrenContainer.style.gap = `${nodeGapSpacing}px`;
        childrenContainer.className = currentLayout === 'vertical'
          ? 'flex relative pt-12'
          : 'flex flex-col relative pl-12';

        member.childrenIds.forEach(childId => {
          childrenContainer.appendChild(buildBranch(childId, visited));
        });

        branch.appendChild(childrenContainer);
      }

      return branch;
    }

    function createMemberCard(member) {
      const card = document.createElement('div');
      card.id = `node-${member.id}`;
      card.className = `tree-card w-56 rounded-2xl p-3 relative cursor-pointer group transition-all duration-200 hover:-translate-y-1`;
      
      card.onclick = (e) => {
        e.stopPropagation();
        populateFormForEdit(member.id);
      };

      const avatar = member.photo 
        ? `<img src="${member.photo}" class="w-12 h-12 ${avatarStyleClass} object-cover avatar-gold-frame shrink-0" alt="${member.name}">`
        : `<div class="w-12 h-12 ${avatarStyleClass} bg-slate-900 avatar-gold-frame flex items-center justify-center text-amber-400 text-lg font-bold shrink-0"><i class="fa-solid fa-user"></i></div>`;

      const dates = (member.birth || member.death) ? `${toBengaliNumerals(member.birth || '?')} – ${toBengaliNumerals(member.death || 'জীবিত')}` : '';

      card.innerHTML = `
        <div class="flex items-center space-x-2.5">
          ${avatar}
          <div class="overflow-hidden flex-1">
            ${member.badge ? `<span class="tree-badge inline-block text-[9px] font-black uppercase tracking-wider px-2 py-0.5 rounded-full mb-0.5">${member.badge}</span>` : ''}
            <h4 class="font-bold text-xs truncate leading-tight">${member.name}</h4>
            ${dates ? `<p class="tree-card-subtext text-[10px] font-semibold opacity-90 mt-0.5">${dates}</p>` : ''}
          </div>
        </div>

        <!-- Floating Controls -->
        <div class="absolute -bottom-3 left-1/2 -translate-x-1/2 opacity-0 group-hover:opacity-100 transition-all flex gap-1.5 bg-slate-950 border border-amber-500/50 rounded-full px-2.5 py-0.5 shadow-xl z-20 text-[10px]">
          <button onclick="event.stopPropagation(); prepareAddChildForm('${member.id}')" class="font-bold text-amber-400 hover:underline">+সন্তান</button>
          <span class="text-slate-700">|</span>
          <button onclick="event.stopPropagation(); populateFormForEdit('${member.id}')" class="font-bold text-sky-400 hover:underline">সম্পাদন</button>
          <span class="text-slate-700">|</span>
          <button onclick="event.stopPropagation(); deleteMember('${member.id}')" class="font-bold text-rose-400 hover:underline">মুছুন</button>
        </div>
      `;

      return card;
    }

    // Dynamic Connection Lines Rendering
    function drawConnectors() {
      const svg = document.getElementById('svgConnectors');
      svg.innerHTML = '';

      familyData.forEach(parent => {
        if (!parent.childrenIds || parent.childrenIds.length === 0) return;

        const parentEl = document.getElementById(`node-${parent.id}`);
        if (!parentEl) return;

        const pRect = parentEl.getBoundingClientRect();
        const containerRect = document.getElementById('treeContainer').getBoundingClientRect();

        parent.childrenIds.forEach(childId => {
          const childEl = document.getElementById(`node-${childId}`);
          if (!childEl) return;

          const cRect = childEl.getBoundingClientRect();

          let x1, y1, x2, y2;

          if (currentLayout === 'vertical') {
            x1 = pRect.left + pRect.width / 2 - containerRect.left;
            y1 = pRect.bottom - containerRect.top;
            x2 = cRect.left + cRect.width / 2 - containerRect.left;
            y2 = cRect.top - containerRect.top;
          } else {
            x1 = pRect.right - containerRect.left;
            y1 = pRect.top + pRect.height / 2 - containerRect.top;
            x2 = cRect.left - containerRect.left;
            y2 = cRect.top + cRect.height / 2 - containerRect.top;
          }

          const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          path.setAttribute('class', 'tree-line');
          
          if (currentLayout === 'vertical') {
            const midY = y1 + (y2 - y1) / 2;
            path.setAttribute('d', `M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY}, ${x2} ${y2}`);
          } else {
            const midX = x1 + (x2 - x1) / 2;
            path.setAttribute('d', `M ${x1} ${y1} C ${midX} ${y1}, ${midX} ${y2}, ${x2} ${y2}`);
          }

          svg.appendChild(path);
        });
      });
    }

    // --- FORM ACTIONS ---
    function populateFormSelectors() {
      const fatherSelect = document.getElementById('fFatherId');
      const motherSelect = document.getElementById('fMotherId');
      const spouseSelect = document.getElementById('fSpouseId');

      fatherSelect.innerHTML = '<option value="">-- পিতা নির্বাচন করুন --</option>';
      motherSelect.innerHTML = '<option value="">-- মাতা নির্বাচন করুন --</option>';
      spouseSelect.innerHTML = '<option value="">-- স্বামী/স্ত্রী নির্বাচন করুন --</option>';

      familyData.forEach(m => {
        const optionText = `${m.name} (${m.badge || 'সদস্য'})`;
        fatherSelect.innerHTML += `<option value="${m.id}">${optionText}</option>`;
        motherSelect.innerHTML += `<option value="${m.id}">${optionText}</option>`;
        spouseSelect.innerHTML += `<option value="${m.id}">${optionText}</option>`;
      });
    }

    function prepareNewMemberForm() {
      clearFormFill();
      switchSidebarTab('form');
      document.getElementById('formHeadingTitle').innerText = 'নতুন সদস্য যোগ করুন';
    }

    function prepareAddChildForm(parentId) {
      clearFormFill();
      const parent = familyData.find(m => m.id === parentId);
      if (parent) {
        if (parent.gender === 'female') {
          document.getElementById('fMotherId').value = parentId;
          if (parent.spouseId) document.getElementById('fFatherId').value = parent.spouseId;
        } else {
          document.getElementById('fFatherId').value = parentId;
          if (parent.spouseId) document.getElementById('fMotherId').value = parent.spouseId;
        }
      }
      switchSidebarTab('form');
      document.getElementById('formHeadingTitle').innerText = 'সন্তান যোগ করুন';
    }

    function populateFormForEdit(id) {
      const member = familyData.find(m => m.id === id);
      if (!member) return;

      document.getElementById('formMemberId').value = member.id;
      document.getElementById('fName').value = member.name || '';
      document.getElementById('fBadge').value = member.badge || '';
      document.getElementById('fGender').value = member.gender || 'male';
      document.getElementById('fBirth').value = member.birth || '';
      document.getElementById('fDeath').value = member.death || '';
      document.getElementById('fPhotoUrl').value = member.photo || '';
      document.getElementById('fBio').value = member.bio || '';
      document.getElementById('fFatherId').value = member.fatherId || '';
      document.getElementById('fMotherId').value = member.motherId || '';
      document.getElementById('fSpouseId').value = member.spouseId || '';

      document.getElementById('formHeadingTitle').innerText = 'তথ্য সম্পাদনা করুন';
      switchSidebarTab('form');
    }

    function handleFormFillSubmit(e) {
      e.preventDefault();

      const memberId = document.getElementById('formMemberId').value;
      const fatherId = document.getElementById('fFatherId').value || null;
      const motherId = document.getElementById('fMotherId').value || null;
      const spouseId = document.getElementById('fSpouseId').value || null;

      const memberObj = {
        id: memberId || Date.now().toString(),
        name: document.getElementById('fName').value,
        badge: document.getElementById('fBadge').value,
        gender: document.getElementById('fGender').value,
        birth: document.getElementById('fBirth').value,
        death: document.getElementById('fDeath').value,
        photo: document.getElementById('fPhotoUrl').value,
        bio: document.getElementById('fBio').value,
        fatherId: fatherId,
        motherId: motherId,
        spouseId: spouseId,
        childrenIds: []
      };

      if (memberId) {
        const index = familyData.findIndex(m => m.id === memberId);
        if (index !== -1) {
          memberObj.childrenIds = familyData[index].childrenIds || [];
          familyData[index] = memberObj;
        }
      } else {
        familyData.push(memberObj);
      }

      // Sync Relationships
      const primaryParentId = fatherId || motherId;
      if (primaryParentId) {
        const parent = familyData.find(m => m.id === primaryParentId);
        if (parent) {
          parent.childrenIds = parent.childrenIds || [];
          if (!parent.childrenIds.includes(memberObj.id)) parent.childrenIds.push(memberObj.id);
        }
      }

      if (spouseId) {
        const spouse = familyData.find(m => m.id === spouseId);
        if (spouse) spouse.spouseId = memberObj.id;
      }

      saveDataToStorage();
      clearFormFill();
      switchSidebarTab('members');
    }

    function clearFormFill() {
      document.getElementById('treeMemberForm').reset();
      document.getElementById('formMemberId').value = '';
    }

    function deleteMember(id) {
      if (confirm("আপনি কি নিশ্চিত যে এই সদস্যকে মুছে ফেলতে চান?")) {
        familyData = familyData.filter(m => m.id !== id);
        familyData.forEach(m => {
          if (m.spouseId === id) m.spouseId = null;
          if (m.fatherId === id) m.fatherId = null;
          if (m.motherId === id) m.motherId = null;
          if (m.childrenIds) m.childrenIds = m.childrenIds.filter(cId => cId !== id);
        });
        saveDataToStorage();
      }
    }

    function handleFileUpload(event, targetInputId) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          document.getElementById(targetInputId).value = e.target.result;
        };
        reader.readAsDataURL(file);
      }
    }

    // --- LAYOUT & DESIGN CONTROLS ---
    function setLayoutDirection(direction) {
      currentLayout = direction;
      
      const vBtn = document.getElementById('layoutBtn-vertical');
      const hBtn = document.getElementById('layoutBtn-horizontal');

      if (direction === 'vertical') {
        vBtn.className = 'p-2.5 bg-slate-900 border border-amber-400 rounded-xl text-center text-xs font-bold text-amber-300 transition';
        hBtn.className = 'p-2.5 bg-slate-900 border border-slate-800 rounded-xl text-center text-xs font-bold text-slate-400 hover:text-slate-200 transition';
      } else {
        hBtn.className = 'p-2.5 bg-slate-900 border border-amber-400 rounded-xl text-center text-xs font-bold text-amber-300 transition';
        vBtn.className = 'p-2.5 bg-slate-900 border border-slate-800 rounded-xl text-center text-xs font-bold text-slate-400 hover:text-slate-200 transition';
      }

      renderTree();
    }

    function updateNodeSpacing(spacingVal) {
      nodeGapSpacing = parseInt(spacingVal, 10);
      const badge = document.getElementById('spacingValueBadge');
      if (nodeGapSpacing < 35) badge.innerText = 'সংকুচিত';
      else if (nodeGapSpacing > 70) badge.innerText = 'প্রশস্ত';
      else badge.innerText = 'মাঝারি';

      renderTree();
    }

    function setTheme(themeKey) {
      const viewport = document.getElementById('viewport');
      viewport.className = `flex-1 relative overflow-hidden canvas-theme-container theme-${themeKey} flex items-center justify-center canvas-grab`;
      setTimeout(drawConnectors, 30);
    }

    function updateAvatarStyle(styleClass) {
      avatarStyleClass = styleClass;
      renderTree();
    }

    function updateBannerTitle(val) {
      document.getElementById('displayBannerTitle').innerText = val || 'বংশতালিকা';
    }

    function updateBannerSubtitle(val) {
      document.getElementById('displayBannerSub').innerText = val || '';
    }

    // --- JSON BACKUP EXPORT & IMPORT ---
    function exportJSONData() {
      const exportObject = {
        appName: "FamilyTree Royal Gold Studio",
        version: "3.0",
        exportDate: new Date().toISOString(),
        bannerTitle: document.getElementById('familyTitleInput').value,
        bannerSubtitle: document.getElementById('familySubTitleInput').value,
        members: familyData
      };

      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(exportObject, null, 2));
      const downloadAnchor = document.createElement('a');
      downloadAnchor.setAttribute("href", dataStr);
      downloadAnchor.setAttribute("download", `FamilyTree_Gold_Data.json`);
      document.body.appendChild(downloadAnchor);
      downloadAnchor.click();
      downloadAnchor.remove();
    }

    function importJSONData(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed.members && Array.isArray(parsed.members)) {
            familyData = parsed.members;
            if (parsed.bannerTitle) {
              document.getElementById('familyTitleInput').value = parsed.bannerTitle;
              updateBannerTitle(parsed.bannerTitle);
            }
            if (parsed.bannerSubtitle) {
              document.getElementById('familySubTitleInput').value = parsed.bannerSubtitle;
              updateBannerSubtitle(parsed.bannerSubtitle);
            }
            saveDataToStorage();
            alert("বংশতালিকা ডাটা সফলভাবে আপলোড করা হয়েছে!");
          } else if (Array.isArray(parsed)) {
            familyData = parsed;
            saveDataToStorage();
            alert("বংশতালিকা ডাটা সফলভাবে আপলোড করা হয়েছে!");
          } else {
            alert("ত্রুটি: ফাইলের ফরম্যাট সঠিক নয়।");
          }
        } catch(err) {
          alert("ডাটা ফাইল পড়তে সমস্যা হয়েছে।");
        }
      };
      reader.readAsText(file);
    }

    // --- EXPORT MODAL & CAPTURE ENGINE ---
    function openExportModal() {
      document.getElementById('exportModal').classList.remove('hidden');
    }

    function closeExportModal() {
      document.getElementById('exportModal').classList.add('hidden');
    }

    function setExportFrame(presetKey) {
      selectedExportPreset = presetKey;
      document.querySelectorAll('.export-preset-btn').forEach(btn => {
        btn.classList.remove('border-amber-500/80');
        btn.classList.add('border-slate-800');
      });
      document.getElementById(`preset-${presetKey}`).classList.add('border-amber-500/80');
    }

    function executeExport(format) {
      closeExportModal();

      const treeContainer = document.getElementById('treeContainer');
      const viewport = document.getElementById('viewport');

      const prevTransform = document.getElementById('canvasViewport').style.transform;
      document.getElementById('canvasViewport').style.transform = 'scale(1) translate(0,0)';

      const frameWrapper = document.createElement('div');
      frameWrapper.className = `canvas-theme-container ${viewport.className} flex items-center justify-center p-12 aspect-${selectedExportPreset}`;
      frameWrapper.style.position = 'fixed';
      frameWrapper.style.left = '-9999px';
      frameWrapper.style.top = '-9999px';

      const cloneContainer = treeContainer.cloneNode(true);
      frameWrapper.appendChild(cloneContainer);
      document.body.appendChild(frameWrapper);

      setTimeout(() => {
        if (format === 'pdf') {
          html2canvas(cloneContainer, { scale: 2, useCORS: true }).then(canvas => {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({
              orientation: canvas.width > canvas.height ? 'landscape' : 'portrait',
              unit: 'px',
              format: [canvas.width, canvas.height]
            });
            pdf.addImage(canvas.toDataURL('image/png'), 'PNG', 0, 0, canvas.width, canvas.height);
            pdf.save(`FamilyTree-Print.pdf`);
            cleanup();
          });
        } else {
          html2canvas(frameWrapper, { scale: 2, useCORS: true }).then(canvas => {
            const link = document.createElement('a');
            link.download = `FamilyTree-${selectedExportPreset}.${format}`;
            link.href = canvas.toDataURL(`image/${format}`, 0.95);
            link.click();
            cleanup();
          });
        }
      }, 100);

      function cleanup() {
        document.body.removeChild(frameWrapper);
        document.getElementById('canvasViewport').style.transform = prevTransform;
      }
    }
  </script>
